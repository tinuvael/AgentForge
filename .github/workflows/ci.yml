name: Cloud acceptance

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ['3.12', '3.13', '3.14']
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install --only-binary=:all: -e ".[dev]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Record environment
        run: python scripts/ci_report.py environment
      - name: Prepare current Windows Git and canonical temporary root
        if: runner.os == 'Windows'
        shell: python
        run: |
          import hashlib, os, shutil
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          executable = Path(shutil.which("git")).resolve()
          if executable.parent.name.lower() in {"cmd", "bin"}:
              candidates = [executable.parent.parent / a / "bin/git.exe"
                            for a in ("ucrt64", "mingw64", "mingw32")]
              executable = next((p for p in candidates if p.is_file()), executable)
          assert executable.parent.parent.name.lower() in {"ucrt64", "mingw64", "mingw32"}
          digest = hashlib.sha256(executable.read_bytes()).digest()
          independent = executable.with_name("git-ci-copy.exe")
          shutil.copyfile(executable, independent)
          os.replace(independent, executable)
          assert executable.stat().st_nlink == 1
          assert hashlib.sha256(executable.read_bytes()).digest() == digest
          temporary = root / "agentforge-temp"
          temporary.mkdir(exist_ok=True)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as stream:
              stream.write(str(executable.parent.resolve()) + "\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              for name in ("TEMP", "TMP"):
                  stream.write(f"{name}={temporary.resolve()}\n")
      - name: Record prepared Windows environment
        if: runner.os == 'Windows'
        run: python scripts/ci_report.py environment
      - name: Regression suite (includes native platform and multi-client HTTP MCP)
        run: python -m pytest -ra --tb=short --junitxml=reports/pytest.xml
      - name: Native APFS case variants, security and coding acceptance
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: python scripts/ci_macos_apfs.py
      - name: Lint
        if: ${{ !cancelled() }}
        run: ruff check .
      - name: Format
        if: ${{ !cancelled() }}
        run: ruff format --check .
      - name: Whitespace
        if: ${{ !cancelled() }}
        run: python scripts/ci_check_whitespace.py
      - name: Build sdist and wheel
        id: build
        if: ${{ !cancelled() }}
        run: python -m build
      - name: Verify clean wheel and sdist installations outside checkout
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/ci_verify_wheel.py
      - name: Write acceptance status
        if: always()
        run: python scripts/ci_report.py summary
      - name: Upload status and exact versions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/
          retention-days: 14
          if-no-files-found: error
