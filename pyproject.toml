[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agentforge"
version = "0.1.0"
description = "Execution infrastructure for externally directed agents"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115,<1",
    "starlette>=0.40,<2",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
    "alembic>=1.14,<2",
    "mcp>=1.30,<2",
    "anyio>=4.7,<5",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.urls]
Repository = "https://github.com/tinuvael/AgentForge"
Issues = "https://github.com/tinuvael/AgentForge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "windows: requires actual native Windows execution",
    "posix: exercises POSIX-specific descriptors, symlink semantics or race seams",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
