# Main local setup: llama-server with --alias local-model --jinja -c 8192.
# Copy to private configuration; verify the actual GGUF/template/tool loop.
[[providers]]
id = "local-llama"
type = "openai_compatible"
base_url = "http://127.0.0.1:8080/v1"
trust = "local"

[[workers]]
id = "local-4080"
provider = "local-llama"
model = "local-model"
context_window = 8192
supports_streaming = true
supports_tools = true # Declaration only, not observed model quality.
deployment_label = "RTX 4080"
timeout_seconds = 120.0

[workers.options]
temperature = 0.1
