{% extends "base.html" %}{% from "macros.html" import page_header with context %}
{% block title %}{{ tr('Tasks') }} · AgentForge{% endblock %}
{% block location %}Tasks{% endblock %}
{% block content %}{{ page_header("Tasks") }}
<form action="/tasks" method="get" class="filters" hx-sync="this:drop" hx-disabled-elt="find button" hx-get="/tasks" hx-target="#task-table" hx-swap="outerHTML" hx-push-url="true">
  <label>{{ tr('State') }}<select name="state"><option value="">{{ tr('Any') }}</option>{% for state in ['queued','running','completed','failed','cancelled'] %}<option value="{{ state }}" {% if filters.state == state %}selected{% endif %}>{{ tr(state) }}</option>{% endfor %}</select></label>
  <label>{{ tr('Project ID') }}<input name="project_id" value="{{ filters.project_id or '' }}" maxlength="36"></label>
  <label>{{ tr('Agent ID') }}<input name="agent_id" value="{{ filters.agent_id or '' }}" maxlength="100"></label>
  <label>{{ tr('Worker ID') }}<input name="worker_id" value="{{ filters.worker_id or '' }}" maxlength="100"></label>
  <label>{{ tr('Page size') }}<input name="limit" type="number" min="1" max="100" value="{{ filters.limit }}"></label>
  <button type="submit" class="primary">{{ tr('Apply filters') }}</button><a class="button" href="/tasks">{{ tr('Reset') }}</a>
</form>
{% include "task_table.html" %}{% endblock %}
