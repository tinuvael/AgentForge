{% from "macros.html" import language_switch with context %}
<!doctype html>
<html lang="{{ language }}"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false,"allowScriptTags":false}'>
<title>{{ tr("Execution monitor") }} · AgentForge</title>
<link rel="stylesheet" href="/static/dashboard.css"><link rel="stylesheet" href="/static/companion.css">
<script src="/static/operator.js" defer></script><script src="/static/htmx.min.js" defer></script><script src="/static/companion.js" defer></script>
</head><body class="companion" hx-history="false">
<a class="skip" href="#main">{{ tr("Skip to content") }}</a>
<header><a class="brand" href="/companion">AgentForge</a><span class="local">{{ tr("OPERATOR") }}</span>{{ language_switch() }}</header>
<nav aria-label="{{ tr('Primary navigation') }}">
  <a class="chat-link" href="/director">{{ tr("Local chat") }}</a>
  <a href="/">{{ tr("Overview") }}</a>
  <a href="/workflows">{{ tr("Workflows") }}</a>
</nav>
<main id="main"><div id="notice" role="alert"></div>{% block content %}{% endblock %}</main>
</body></html>
